<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17181B" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tu rutina" />
    <title>Tu rutina · Average Joe's</title>

    <!--
      Thumbnail al compartir el link (WhatsApp, Twitter/X, Slack, Discord, etc).
      OJO: "og:url" y "og:image" están puestos como ABSOLUTOS apuntando a un dominio de
      ejemplo. Reemplazá "https://tu-dominio.vercel.app" por tu dominio real de Vercel
      (o el dominio propio si le ponés uno) una vez que hagas el deploy — si no, algunas
      apps (sobre todo WhatsApp) no van a mostrar la imagen.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tu-dominio.vercel.app/" />
    <meta property="og:title" content="Tu rutina · Average Joe's" />
    <meta property="og:description" content="Organizá tus rutinas de entrenamiento, con cronómetro y un entrenador con IA." />
    <meta property="og:image" content="https://tu-dominio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tu rutina · Average Joe's" />
    <meta name="twitter:description" content="Organizá tus rutinas de entrenamiento, con cronómetro y un entrenador con IA." />
    <meta name="twitter:image" content="https://tu-dominio.vercel.app/og-image.png" />

    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #17181B;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
